[metadata]
name = InsightAI
version = 1.0.0
description = Intelligent tabular data analytics platform with deterministic execution and ML anomaly detection
author = Nithin T
license = MIT
python_requires = >=3.10

[options]
packages = src

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[flake8]
max-line-length = 120
exclude = __pycache__,.git,.venv,venv,env
